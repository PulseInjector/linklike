name: Feature Request
description: Suggest a new feature or capability
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Why is this needed? User pain, limitation, or gap today (not the solution yet).
      placeholder: "Example: Users cannot see the learning map in the browser; projects exist only on disk via the CLI."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Commands, APIs, UX, inputs/outputs, example snippets.
    validations:
      required: true
